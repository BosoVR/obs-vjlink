name: Build OBS-VJLink

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]

permissions:
  contents: write

env:
  OBS_VERSION: "32.1.2"
  PLUGIN_NAME: "obs-vjlink"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows:
    name: Build (Windows x64)
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download OBS Studio
        run: |
          $obsUrl = "https://github.com/obsproject/obs-studio/releases/download/${{ env.OBS_VERSION }}/OBS-Studio-${{ env.OBS_VERSION }}-Windows-x64.zip"
          Invoke-WebRequest -Uri $obsUrl -OutFile obs-studio.zip
          Expand-Archive -Path obs-studio.zip -DestinationPath obs-studio-install

      - name: Download OBS SDK headers
        run: |
          $sdkUrl = "https://github.com/obsproject/obs-studio/archive/refs/tags/${{ env.OBS_VERSION }}.zip"
          Invoke-WebRequest -Uri $sdkUrl -OutFile obs-sdk.zip
          Expand-Archive -Path obs-sdk.zip -DestinationPath obs-sdk

      - name: Setup OBS directories
        run: |
          # Create combined SDK directory with headers from source + libs from install
          New-Item -ItemType Directory -Path obs-combined/include -Force
          New-Item -ItemType Directory -Path obs-combined/include/obs -Force
          New-Item -ItemType Directory -Path obs-combined/deps/w32-pthreads -Force
          New-Item -ItemType Directory -Path obs-combined/lib -Force
          New-Item -ItemType Directory -Path obs-combined/bin/64bit -Force

          # Copy headers from source
          $libobs = "obs-sdk/obs-studio-${{ env.OBS_VERSION }}/libobs"
          Copy-Item -Path "$libobs/*.h" -Destination obs-combined/include/ -Force
          Copy-Item -Path "$libobs/*.h" -Destination obs-combined/include/obs/ -Force
          $obsConfig = @(
            "/* Auto-generated OBS config for plugin CI builds. */",
            "#pragma once",
            "",
            "#define OBS_VERSION ""${{ env.OBS_VERSION }}""",
            "#define OBS_VERSION_CANONICAL ""${{ env.OBS_VERSION }}""",
            "#define OBS_DATA_PATH ""data""",
            "#define OBS_INSTALL_PREFIX "".""",
            "#define OBS_PLUGIN_DESTINATION ""obs-plugins/64bit""",
            "#define OBS_RELATIVE_PREFIX ""../../""",
            "",
            "#ifndef ON",
            "#define ON 1",
            "#endif",
            "#ifndef OFF",
            "#define OFF 0",
            "#endif"
          )
          $obsConfig | Set-Content -Path obs-combined/include/obsconfig.h -Encoding ASCII
          Copy-Item -Path obs-combined/include/obsconfig.h -Destination obs-combined/include/obs/ -Force
          foreach ($headerDir in @("audio-monitoring", "callback", "graphics", "media-io", "util")) {
            if (Test-Path "$libobs/$headerDir") {
              Copy-Item -Path "$libobs/$headerDir" -Destination obs-combined/include/ -Recurse -Force
              Copy-Item -Path "$libobs/$headerDir" -Destination obs-combined/include/obs/ -Recurse -Force
            }
          }
          if (Test-Path "obs-sdk/obs-studio-${{ env.OBS_VERSION }}/deps/w32-pthreads") {
            Copy-Item -Path "obs-sdk/obs-studio-${{ env.OBS_VERSION }}/deps/w32-pthreads/*.h" -Destination obs-combined/deps/w32-pthreads/ -Force
          }

          # Copy lib/dll from install
          $obsDll = Get-ChildItem -Path obs-studio-install -Recurse -Filter obs.dll | Select-Object -First 1
          if ($obsDll) {
            Copy-Item -Path $obsDll.FullName -Destination obs-combined/bin/64bit/ -Force
          } else {
            throw "obs.dll not found in downloaded OBS package."
          }
          $obsLib = Get-ChildItem -Path obs-studio-install -Recurse -Filter obs.lib | Select-Object -First 1
          if ($obsLib) {
            Copy-Item -Path $obsLib.FullName -Destination obs-combined/lib/ -Force
          }
          $pthreadDll = Get-ChildItem -Path obs-studio-install -Recurse -Filter w32-pthreads.dll | Select-Object -First 1
          if ($pthreadDll) {
            Copy-Item -Path $pthreadDll.FullName -Destination obs-combined/bin/64bit/ -Force
          } else {
            throw "w32-pthreads.dll not found in downloaded OBS package."
          }
          $pthreadLib = Get-ChildItem -Path obs-studio-install -Recurse -Filter w32-pthreads.lib | Select-Object -First 1
          if ($pthreadLib) {
            Copy-Item -Path $pthreadLib.FullName -Destination obs-combined/lib/ -Force
          }

          function New-ImportLibFromDll {
            param(
              [string]$DllPath,
              [string]$ModuleName,
              [string]$LibPath
            )

            if (!(Test-Path $DllPath) -or (Test-Path $LibPath)) {
              return
            }

            $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
            $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
            if (!$vsPath) {
              throw "Visual Studio C++ tools not found."
            }

            $msvcDir = Get-ChildItem -Path (Join-Path $vsPath "VC\Tools\MSVC") -Directory |
              Sort-Object Name -Descending |
              Select-Object -First 1
            $dumpbin = Join-Path $msvcDir.FullName "bin\Hostx64\x64\dumpbin.exe"
            $libExe = Join-Path $msvcDir.FullName "bin\Hostx64\x64\lib.exe"
            if (!(Test-Path $dumpbin) -or !(Test-Path $libExe)) {
              throw "dumpbin.exe or lib.exe not found below $($msvcDir.FullName)."
            }

            $exports = & $dumpbin /nologo /exports $DllPath |
              Select-String '^\s+\d+\s+[0-9A-Fa-f]+\s+[0-9A-Fa-f]+\s+(\S+)' |
              ForEach-Object { $_.Matches[0].Groups[1].Value } |
              Where-Object { $_ -and ($_ -notmatch '^\[') } |
              Sort-Object -Unique

            if (!$exports) {
              throw "No exports found in $DllPath."
            }

            $defPath = Join-Path (Split-Path $LibPath -Parent) "$ModuleName.def"
            @("LIBRARY $ModuleName", "EXPORTS") + $exports | Set-Content -Path $defPath -Encoding ASCII
            & $libExe /nologo /machine:x64 "/def:$defPath" "/out:$LibPath"
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to create import lib $LibPath."
            }
          }

          New-ImportLibFromDll `
            -DllPath "obs-combined/bin/64bit/obs.dll" `
            -ModuleName "obs" `
            -LibPath "obs-combined/lib/obs.lib"
          New-ImportLibFromDll `
            -DllPath "obs-combined/bin/64bit/w32-pthreads.dll" `
            -ModuleName "w32-pthreads" `
            -LibPath "obs-combined/lib/w32-pthreads.lib"
          foreach ($requiredLib in @("obs.lib", "w32-pthreads.lib")) {
            if (!(Test-Path "obs-combined/lib/$requiredLib")) {
              throw "$requiredLib was not created."
            }
          }

      - name: Configure CMake
        run: |
          cmake -B build -G "Visual Studio 17 2022" -A x64 `
            -DOBS_DIR="${{ github.workspace }}/obs-combined" `
            -DOBS_PLUGIN_DEST="${{ github.workspace }}/build/output/obs-plugins/64bit" `
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/build/install"

      - name: Build
        run: cmake --build build --config Release

      - name: Package
        run: |
          New-Item -ItemType Directory -Path release/${{ env.PLUGIN_NAME }}/obs-plugins/64bit -Force
          New-Item -ItemType Directory -Path release/${{ env.PLUGIN_NAME }}/data/obs-plugins/${{ env.PLUGIN_NAME }} -Force

          # Copy DLL
          $dll = Get-ChildItem -Path build -Recurse -Filter "${{ env.PLUGIN_NAME }}.dll" | Select-Object -First 1
          if ($dll) {
            Copy-Item $dll.FullName -Destination release/${{ env.PLUGIN_NAME }}/obs-plugins/64bit/
          }

          # Copy data files
          Copy-Item -Path effects -Destination release/${{ env.PLUGIN_NAME }}/data/obs-plugins/${{ env.PLUGIN_NAME }}/effects -Recurse
          Copy-Item -Path effects_meta -Destination release/${{ env.PLUGIN_NAME }}/data/obs-plugins/${{ env.PLUGIN_NAME }}/effects_meta -Recurse
          Copy-Item -Path presets -Destination release/${{ env.PLUGIN_NAME }}/data/obs-plugins/${{ env.PLUGIN_NAME }}/presets -Recurse
          Copy-Item -Path data/* -Destination release/${{ env.PLUGIN_NAME }}/data/obs-plugins/${{ env.PLUGIN_NAME }}/ -Recurse
          if (Test-Path web-ui) {
            Copy-Item -Path web-ui -Destination release/${{ env.PLUGIN_NAME }}/data/obs-plugins/${{ env.PLUGIN_NAME }}/web-ui -Recurse
          }

          # Create ZIP
          $packageVersion = "${{ github.ref_name }}"
          if (!$packageVersion -or $packageVersion -in @("main", "master")) {
            $packageVersion = "${{ github.sha }}"
          }
          Compress-Archive -Path release/${{ env.PLUGIN_NAME }}/* -DestinationPath "OBS-VJLink-$packageVersion-win64.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PLUGIN_NAME }}-win64
          path: release/${{ env.PLUGIN_NAME }}/

      - name: Upload Release Asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          body_path: CHANGELOG/${{ github.ref_name }}.md
          files: OBS-VJLink-${{ github.ref_name }}-win64.zip
